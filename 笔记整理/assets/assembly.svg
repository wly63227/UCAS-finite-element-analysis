<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title"><title id="title">两个杆单元的局部节点映射到共享全局节点</title><rect width="100%" height="100%" fill="#f5f7fa"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#172f43" font-size="17"><path d="M100 130H620" stroke="#315c78" stroke-width="8"/><g fill="#fff" stroke="#172f43" stroke-width="3"><circle cx="100" cy="130" r="14"/><circle cx="360" cy="130" r="14"/><circle cx="620" cy="130" r="14"/></g><text x="90" y="95">0</text><text x="350" y="95">1</text><text x="610" y="95">2</text><text x="170" y="175">e₁: [0,1]</text><text x="435" y="175">e₂: [1,2]</text><text x="140" y="230">共享节点 1 的刚度贡献相加</text><text x="140" y="270">K₁₁ = K¹₂₂ + K²₁₁</text></g></svg>